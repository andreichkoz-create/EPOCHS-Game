<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#18261d"><title>ЭПОХИ — Пролог</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c16;color:#f4e8c8;font-family:system-ui,-apple-system,sans-serif;touch-action:none}

body.playing aside{display:block}#hint{font-size:11px;min-height:19px;text-align:center;color:#d2c19d;margin-bottom:8px}#tools{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}#tools button{padding:8px 2px;font-size:10px;min-height:55px;line-height:1.3;border-radius:9px}#tools button span{display:block;font-size:22px}#tools button.on{background:linear-gradient(#e5bd76,#b17b38);color:#30210f;border:2px solid #ffdfa1}

#mainMenu.hidden{display:none}#menuPanel{width:min(430px,100%);border:2px solid #c7a26a;border-radius:25px;background:linear-gradient(155deg,#304333eb,#101c16f5);padding:35px 18px;box-shadow:0 16px 50px #000b, inset 0 1px #fff3}
#menuPanel h1{font:900 clamp(48px,13vw,76px) Georgia,serif;letter-spacing:3px;margin:7px 0;text-shadow:0 5px 2px #211406;color:#f6d59b}
#menuPanel p{letter-spacing:2px;font-size:12px;margin-bottom:34px}#menuEmblem{font-size:80px;filter:drop-shadow(0 7px 14px #e78626a0)}

#menuPanel{position:relative;overflow:hidden}#menuPanel:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 12%,#d9b16b40,transparent 52%);pointer-events:none}#menuPanel button{position:relative;box-shadow:0 5px 0 #3c2615,0 8px 20px #0007}#menuPanel h1{text-shadow:0 3px 0 #594127,0 0 24px #e2ae5860}#menuEmblem{filter:drop-shadow(0 7px 14px #df8a37)}
@media(max-width:360px){#mini{width:88px;height:88px}#miniWrap{top:105px;right:6px}}
</style>
<canvas id="map"></canvas><div id="miniWrap"><canvas id="mini" width="112" height="112"></canvas><div id="miniLabel">КАРТА МИРА</div></div><section id="mainMenu"><div id="menuPanel"><div id="menuEmblem">🔥</div><h1>ЭПОХИ</h1><p>ПРОЛОГ · ПЕРВЫЕ ЛЮДИ</p><button onclick="newGame()">Новая игра</button><button id="continueBtn" onclick="continueGame()">Продолжить</button><div id="overwrite" style="display:none;margin-top:14px;padding:12px;border:1px solid #c7a26a;border-radius:12px;background:#1f2e22"><div>Создать новый мир вместо сохранённого?</div><button onclick="startFresh()">Да, новая игра</button><button onclick="document.getElementById('overwrite').style.display='none'">Отмена</button></div></div></section>
<header id="gameTop"><div class="headline"><b>ЭПОХИ · ПЕРВЫЕ ЛЮДИ</b><div><button onclick="save()">💾</button> <button onclick="returnMenu()">☰ Меню</button></div></div><span id="info"></span></header>
<aside><div id="hint">Выбери место для первого кострища</div><div id="tools">
<button onclick="tool='camp';setButtons()">🔥<span>🔥</span>Лагерь</button>
<button onclick="tool='hut';setButtons()"><span>🛖</span>Хижина</button>
<button onclick="tool='store';setButtons()"><span>📦</span>Склад</button>
<button onclick="tool='move';setButtons()"><span>🧍</span>Приказ</button>
<button onclick="tool='pan';setButtons()"><span>✋</span>Карта</button>
</div></aside><script>
const c=document.querySelector('#map'),g=c.getContext('2d');const mini=document.querySelector('#mini'),mg=mini.getContext('2d');let miniBase=null;let miniTick=0;let lastInfo='',lastFrameCost=0,adaptiveDelay=50,renderErrors=0;let terrainCache=document.createElement('canvas'),terrainCtx=terrainCache.getContext('2d'),terrainDirty=true,terrainReady=false,painted=0;let W=0,H=0,scale=1.25,ox=0,oy=0,tool='camp',speed=1,selected=0,playing=false;
const SIZE=48,N=52;let land=[],buildings=[],people=[],stock={wood:25,stone:12,food:25},clock=8,day=1,camp=false,last=performance.now(),stamp=0;
function rand(s){let a=s|0;return()=>{a=(a*1664525+1013904223)|0;return(a>>>0)/4294967296}}function create(){const r=rand(Date.now());land=Array.from({length:N*N},()=>{const a=r();return a<.07?'water':a<.26?'forest':a<.35?'stone':a<.46?'berry':'field'});buildings=[];people=[];stock={wood:25,stone:12,food:25};clock=8;day=1;camp=false;scale=1.25;centerCamera();miniBase=null;terrainDirty=true}
const T={water:'#375c67',forest:'#315b39',stone:'#6b7069',berry:'#68783b',field:'#68794b'};
function resize(){const dpr=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function screen(x,y){return {x:(x*SIZE+ox)*scale,y:(y*SIZE+oy)*scale}}function coord(x,y){return{x:Math.floor((x/scale-ox)/SIZE),y:Math.floor((y/scale-oy)/SIZE)}}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function notice(msg){document.querySelector('#hint').textContent=msg;document.querySelector('#info').textContent='☀️ День '+day+' · '+Math.floor(clock)+':00 👥 '+people.length+' 🪵 '+stock.wood+' 🪨 '+stock.stone+' 🍎 '+stock.food}function place(x,y){if(!inside(x,y)){notice('Выберите клетку внутри карты');return}if(land[y*N+x]==='water'){notice('На воде строить нельзя');return}if(buildings.some(a=>a.x===x&&a.y===y)&&tool!=='move'){notice('Это место уже занято');return}
if(tool==='camp'&&!camp){buildings.push({x,y,type:'camp'});camp=true;people=[{x:x+1,y:y+1,tx:x+1,ty:y+1,hunger:0,work:0},{x:x-1,y:y,tx:x-1,ty:y,hunger:0,work:0}];notice('Лагерь основан! Два жителя появились');save();renderNow();}
else if(tool==='hut'&&camp&&stock.wood>=15&&stock.stone>=5){stock.wood-=15;stock.stone-=5;buildings.push({x,y,type:'hut'});if(people.length<15)people.push({x,y,tx:x,ty:y,hunger:0,work:0});notice('Хижина построена');renderNow()}
else if(tool==='store'&&camp&&stock.wood>=12){stock.wood-=12;buildings.push({x,y,type:'store'});notice('Склад построен');renderNow()}
else if(tool==='move'&&camp){const p=people[selected%people.length];p.tx=x;p.ty=y;p.manual=18;selected++;notice('Приказ жителю отправлен');renderNow()}}
function chooseTarget(p){if(!camp||p.manual>0)return;if(p.hunger>60){const b=buildings[0];p.tx=b.x;p.ty=b.y;return}const opts=[];for(let y=Math.max(0,Math.floor(p.y)-8);y<Math.min(N,Math.floor(p.y)+9);y++)for(let x=Math.max(0,Math.floor(p.x)-8);x<Math.min(N,Math.floor(p.x)+9);x++){let t=land[y*N+x];if(t==='forest'||t==='stone'||t==='berry')opts.push({x,y,d:dist(p,{x,y}),t})}opts.sort((a,b)=>a.d-b.d);const o=opts[0];if(o){p.tx=o.x;p.ty=o.y}else{p.tx=buildings[0].x;p.ty=buildings[0].y}}
function tick(dt){clock+=dt*.017*speed;if(clock>=24){clock-=24;day++}for(const p of people){p.work??=0;p.manual=Math.max(0,(p.manual||0)-dt*speed);p.hunger+=dt*.06*speed;const d=Math.hypot(p.tx-p.x,p.ty-p.y);if(d>.15){p.work=0;p.x+=(p.tx-p.x)/d*Math.min(d,dt*.45*speed);p.y+=(p.ty-p.y)/d*Math.min(d,dt*.45*speed)}else{const x=Math.round(p.x),y=Math.round(p.y),t=inside(x,y)?land[y*N+x]:null;if(p.hunger>60&&stock.food>0){stock.food--;p.hunger=10;p.work=0;chooseTarget(p)}else if(t==='forest'||t==='stone'||t==='berry'){p.work+=dt*speed;const duration=t==='forest'?7:t==='stone'?10:6;if(p.work>=duration){p.work=0;if(t==='forest'){stock.wood++;if(Math.random()<.2)land[y*N+x]='field';miniBase=null;terrainDirty=true}else if(t==='stone'){stock.stone++;if(Math.random()<.15)land[y*N+x]='field'}else{stock.food+=2;if(Math.random()<.3)land[y*N+x]='field'}chooseTarget(p)}}else{p.work=0;chooseTarget(p)}}}}
function hash(x,y,z=0){let k=Math.sin(x*127.1+y*311.7+z*74.7)*43758.5453;return k-Math.floor(k)}
function poly(pts,color){g.fillStyle=color;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function ellipse(x,y,rx,ry,color){g.fillStyle=color;g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fill()}
function tree(x,y,k){const v=hash(k,2);ellipse(x+3,y+5,13,5,'#13291c86');g.fillStyle='#60492c';g.fillRect(x-2,y-2,5,14);ellipse(x-7,y-8,11,12,'#183e2a');ellipse(x+6,y-13,12,15,v>.5?'#295f3d':'#326c42');ellipse(x-4,y-20,10,12,'#43864c');ellipse(x+2,y-21,6,4,'#77a15b65')}
function rock(x,y,k){ellipse(x+2,y+9,14,6,'#1e28227a');poly([[x-12,y+7],[x-11,y-5],[x-3,y-12],[x+10,y-7],[x+15,y+6],[x+3,y+12]],'#73786e');poly([[x-11,y-5],[x-3,y-12],[x+3,y-2],[x-1,y+7],[x-12,y+7]],'#aeb4a6');poly([[x+3,y-2],[x+10,y-7],[x+15,y+6],[x+3,y+12],[x-1,y+7]],'#515d57');}
function hut(x,y){ellipse(x,y+13,25,12,'#16251c99');poly([[x-22,y+8],[x,y-19],[x+23,y+8]],'#4c301f');poly([[x-18,y+8],[x,y-25],[x+18,y+8]],'#b28d50');for(let i=-3;i<=3;i++){g.strokeStyle='#6c4e2b';g.lineWidth=2;g.beginPath();g.moveTo(x,y-23);g.lineTo(x+i*6,y+8);g.stroke()}poly([[x-7,y+8],[x-6,y-2],[x,y-11],[x+6,y-2],[x+7,y+8]],'#221c15')}
function campfire(x,y,t){ellipse(x,y+7,17,8,'#1c211b');for(let i=0;i<7;i++)ellipse(x+Math.cos(i*6.28/7)*11,y+7+Math.sin(i*6.28/7)*5,5,3,'#9f9785');g.strokeStyle='#63402b';g.lineWidth=4;g.beginPath();g.moveTo(x-9,y+5);g.lineTo(x+10,y+8);g.moveTo(x+9,y+4);g.lineTo(x-8,y+9);g.stroke();let wave=Math.sin(t*5)*3;poly([[x-7,y+4],[x-7,y-9],[x,y-25-wave],[x+6,y-9],[x+5,y+4]],'#e88729');poly([[x-3,y+4],[x-2,y-7],[x+2,y-15-wave*.4],[x+4,y+3]],'#ffe18d')}
function buildTerrainCache(){const pw=Math.round(N*SIZE*.8);terrainCache.width=pw;terrainCache.height=pw;const factor=pw/(N*SIZE);const old=g;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=land[y*N+x];const px=x*SIZE*factor,py=y*SIZE*factor,size=SIZE*factor;terrainCtx.fillStyle=t==='water'?'#356d76':hash(x,y)>.5?'#76925e':'#688652';terrainCtx.fillRect(px,py,size+1,size+1);if(t==='forest'){terrainCtx.fillStyle='#275639';terrainCtx.beginPath();terrainCtx.arc(px+size*.5,py+size*.48,size*.35,0,Math.PI*2);terrainCtx.fill();terrainCtx.fillStyle='#4f8e59';terrainCtx.beginPath();terrainCtx.arc(px+size*.43,py+size*.33,size*.24,0,Math.PI*2);terrainCtx.fill()}else if(t==='stone'){terrainCtx.fillStyle='#89938c';terrainCtx.beginPath();terrainCtx.moveTo(px+size*.2,py+size*.7);terrainCtx.lineTo(px+size*.4,py+size*.22);terrainCtx.lineTo(px+size*.75,py+size*.35);terrainCtx.lineTo(px+size*.85,py+size*.76);terrainCtx.closePath();terrainCtx.fill()}else if(t==='berry'){terrainCtx.fillStyle='#467746';terrainCtx.beginPath();terrainCtx.arc(px+size*.5,py+size*.5,size*.29,0,Math.PI*2);terrainCtx.fill();terrainCtx.fillStyle='#bb5050';terrainCtx.fillRect(px+size*.5,py+size*.38,3,3)}}terrainReady=true;terrainDirty=false}
function draw(){
const width=innerWidth,height=innerHeight;g.clearRect(0,0,width,height);g.fillStyle='#16291f';g.fillRect(0,0,width,height);
const tw=SIZE*scale,t=performance.now()/1000;
const x0=Math.max(0,Math.floor((-ox*scale)/tw)-1),x1=Math.min(N,Math.ceil((width-ox*scale)/tw)+1);
const y0=Math.max(0,Math.floor((-oy*scale)/tw)-1),y1=Math.min(N,Math.ceil((height-oy*scale)/tw)+1);
if(terrainDirty||!terrainReady)buildTerrainCache();const worldPx=N*SIZE;const sx=ox*scale,sy=oy*scale;g.drawImage(terrainCache,sx,sy,worldPx*scale,worldPx*scale);if(clock<6||clock>19){g.fillStyle='#24485a22';g.fillRect(0,0,width,height)}
for(const b of buildings){const p=screen(b.x,b.y);g.save();g.translate(p.x+tw/2,p.y+tw/2);g.scale(scale,scale);if(b.type==='camp')campfire(0,0,t);else if(b.type==='hut')hut(0,0);else{ellipse(0,9,21,8,'#16251eaa');g.fillStyle='#977444';g.fillRect(-17,-10,34,21);g.strokeStyle='#51351f';g.lineWidth=3;g.strokeRect(-17,-10,34,21);g.beginPath();g.moveTo(-17,-10);g.lineTo(17,11);g.moveTo(17,-10);g.lineTo(-17,11);g.stroke()}g.restore()}
for(const p of people){const q=screen(p.x,p.y);g.save();g.translate(q.x+tw/2,q.y+tw/2);g.scale(scale,scale);ellipse(0,13,8,3,'#1b2d22a0');ellipse(0,-10,6,6,'#d3a276');ellipse(0,-14,6,3,'#51382b');poly([[-6,-3],[6,-3],[9,11],[-9,11]],'#90623f');ellipse(2,0,3,4,'#b98c5e');g.strokeStyle='#d9ad84';g.lineWidth=3;g.beginPath();g.moveTo(-6,1);g.lineTo(-11,8);g.moveTo(6,1);g.lineTo(11,7);g.stroke();g.restore()}
if(clock<6||clock>19){g.fillStyle='rgba(5,13,33,.25)';g.fillRect(0,0,width,height)}
const info='☀️ День '+day+' · '+Math.floor(clock)+':00   👥 '+people.length+'   🪵 '+stock.wood+'   🪨 '+stock.stone+'   🍎 '+stock.food;if(info!==lastInfo){document.querySelector('#info').textContent=info;lastInfo=info}
}
let drag=null;
c.addEventListener('pointerdown',e=>{if(!playing)return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){};drag={startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,panning:false};});
c.addEventListener('pointermove',e=>{if(!drag||!playing)return;e.preventDefault();const delta=Math.hypot(e.clientX-drag.startX,e.clientY-drag.startY);if(delta>13)drag.panning=true;if(drag.panning){ox+=(e.clientX-drag.x)/scale;oy+=(e.clientY-drag.y)/scale;}drag.x=e.clientX;drag.y=e.clientY;});
c.addEventListener('pointerup',e=>{if(!drag||!playing)return;e.preventDefault();const wasPan=drag.panning;drag=null;if(!wasPan){const q=coord(e.clientX,e.clientY);place(q.x,q.y);}});
c.addEventListener('pointercancel',()=>{drag=null});
c.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(2,scale*(e.deltaY>0?.88:1.12)))},{passive:false});
const SAVE_KEY='epochs-save-v1';function hasSave(){try{let d=JSON.parse(localStorage.getItem(SAVE_KEY));return Boolean(d&&d.land&&d.land.length===N*N)}catch(e){return false}}function save(){if(!playing)return;localStorage.setItem(SAVE_KEY,JSON.stringify({land,buildings,people,stock,clock,day,camp,ox,oy,scale}));if(!document.querySelector('#hint').textContent.includes('Приказ'))document.querySelector('#hint').textContent='Мир сохранён на этом устройстве'}function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(!d||d.land?.length!==N*N)return false;({land,buildings,people,stock,clock,day,camp,ox,oy,scale}=d);people.forEach(p=>p.work??=0);return true}catch(e){return false}}function reset(){if(confirm('Создать новый мир? Старый прогресс будет удалён.')){localStorage.removeItem(SAVE_KEY);create()}}function centerCamera(){ox=innerWidth/(2*scale)-N*SIZE/2;oy=innerHeight/(2*scale)-N*SIZE/2}function enterGame(){playing=true;resize();document.body.classList.add('playing');document.querySelector('#mainMenu').classList.add('hidden');document.querySelector('#hint').textContent=camp?'Выберите инструмент':'Нажмите на карту для установки кострища'}function newGame(){if(hasSave()){document.querySelector('#overwrite').style.display='block';return}startFresh()}function startFresh(){document.querySelector('#overwrite').style.display='none';localStorage.removeItem(SAVE_KEY);create();enterGame();save();draw()}function continueGame(){if(load()){miniBase=null;terrainDirty=true;if(!Number.isFinite(ox)||!Number.isFinite(oy)||!Number.isFinite(scale)||scale<.35||scale>3){scale=1.25;centerCamera()}enterGame();draw()}else{updateMenu()}}function setButtons(){document.querySelectorAll('#tools button').forEach(b=>{const handler=b.getAttribute('onclick')||'';b.classList.toggle('on',handler.includes("tool='"+tool+"'"))})}function updateMenu(){document.querySelector('#continueBtn').disabled=!hasSave()}function returnMenu(){save();playing=false;document.body.classList.remove('playing');document.querySelector('#mainMenu').classList.remove('hidden');updateMenu()}create();updateMenu();setButtons();
function drawMini(){if(!land||land.length!==N*N)return;const sz=112,d=sz/N;if(!miniBase){miniBase=document.createElement('canvas');miniBase.width=sz;miniBase.height=sz;let m=miniBase.getContext('2d');for(let y=0;y<N;y++)for(let x=0;x<N;x++){let v=land[y*N+x];m.fillStyle=v==='water'?'#387c9b':v==='forest'?'#28573a':v==='stone'?'#9b9b82':v==='berry'?'#81a35a':'#638456';m.fillRect(x*d,y*d,d+0.4,d+0.4)}}mg.clearRect(0,0,sz,sz);mg.drawImage(miniBase,0,0);for(let b of buildings){mg.fillStyle=b.type==='camp'?'#ffb24c':'#ffdf9a';mg.fillRect(b.x*d-2,b.y*d-2,4,4)}for(let p of people){mg.fillStyle='#ffffff';mg.fillRect(p.x*d-1,p.y*d-1,2,2)}mg.strokeStyle='#ffe7a5';mg.lineWidth=1.5;mg.strokeRect((-ox/SIZE)*d,(-oy/SIZE)*d,(innerWidth/(SIZE*scale))*d,(innerHeight/(SIZE*scale))*d)}
mini.addEventListener('pointerdown',e=>{if(!playing)return;e.stopPropagation();const a=mini.getBoundingClientRect();let x=(e.clientX-a.left)/a.width*N,y=(e.clientY-a.top)/a.height*N;ox=innerWidth/(2*scale)-x*SIZE;oy=innerHeight/(2*scale)-y*SIZE;renderNow();drawMini()});
function renderNow(){try{draw();renderErrors=0}catch(e){if(renderErrors++<2){document.querySelector('#hint').textContent='Сбой графики: '+String(e.message||e);console.error(e)}}}let lastRender=0;function frame(now){try{let dt=Math.min(.1,(now-last)/1000);last=now;stamp+=dt;if(playing&&stamp>.22){tick(stamp);stamp=0}if(playing&&now-lastRender>adaptiveDelay){const t0=performance.now();renderNow();const cost=performance.now()-t0;lastFrameCost=lastFrameCost*.85+cost*.15;adaptiveDelay=lastFrameCost>32?100:lastFrameCost>18?70:50;lastRender=now}if(playing&&now-miniTick>1000){drawMini();miniTick=now}}catch(e){document.querySelector('#hint').textContent='Ошибка карты: '+e.message;console.error(e)}requestAnimationFrame(frame)}requestAnimationFrame(frame);setInterval(()=>{if(playing)save()},30000)
</script></html>
