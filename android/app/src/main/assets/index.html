<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#18261d"><title>ЭПОХИ — Пролог</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101c16;color:#f3ebd3;font:14px system-ui;overflow:hidden}canvas{display:block;touch-action:none}header{position:fixed;top:0;left:0;right:0;display:flex;gap:12px;padding:10px 13px;background:#14221de9;align-items:center;flex-wrap:wrap}button{background:#8e6334;color:white;border:1px solid #d2a86b;border-radius:8px;padding:8px;cursor:pointer}button.on{background:#d8b473;color:#1c1b17}aside{position:fixed;bottom:8px;left:8px;right:8px;background:#15231ee9;border:1px solid #7d6948;border-radius:12px;padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}small{opacity:.8}#hint{flex:1;min-width:155px}</style>
<canvas id="map"></canvas><header><b>ЭПОХИ · Первые люди</b><span id="info"></span><button onclick="save()">Сохранить</button><button onclick="reset()">Новый мир</button></header><aside><small id="hint">Выбери место для кострища. Затем строй жильё и направляй жителей.</small><button onclick="tool='camp';setButtons()">🔥 Кострище</button><button onclick="tool='hut';setButtons()">⌂ Хижина</button><button onclick="tool='store';setButtons()">▣ Склад</button><button onclick="tool='move';setButtons()">↗ Приказ</button><button onclick="tool='pan';setButtons()">✋ Карта</button><button onclick="speed=speed===1?3:1">⏩</button></aside>
<script>
const c=document.querySelector('canvas'),g=c.getContext('2d');let W=0,H=0,scale=1,ox=0,oy=0,tool='camp',speed=1,selected=0;
const SIZE=48,N=52;let land=[],buildings=[],people=[],stock={wood:25,stone:12,food:25},clock=8,day=1,camp=false,last=performance.now(),stamp=0;
function rand(s){let a=s|0;return()=>{a=(a*1664525+1013904223)|0;return(a>>>0)/4294967296}}function create(){const r=rand(Date.now());land=Array.from({length:N*N},()=>{const a=r();return a<.07?'water':a<.26?'forest':a<.35?'stone':a<.46?'berry':'field'});buildings=[];people=[];stock={wood:25,stone:12,food:25};clock=8;day=1;camp=false;ox=0;oy=0;scale=1}
const T={water:'#375c67',forest:'#315b39',stone:'#6b7069',berry:'#68783b',field:'#68794b'};
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';g.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();
function screen(x,y){return {x:(x*SIZE+ox)*scale,y:(y*SIZE+oy)*scale}}function coord(x,y){return{x:Math.floor((x/scale-ox)/SIZE),y:Math.floor((y/scale-oy)/SIZE)}}function inside(x,y){return x>=0&&y>=0&&x<N&&y<N}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function place(x,y){if(!inside(x,y)||land[y*N+x]==='water'||buildings.some(a=>a.x===x&&a.y===y))return;
if(tool==='camp'&&!camp){buildings.push({x,y,type:'camp'});camp=true;people=[{x:x+1,y:y+1,tx:x+1,ty:y+1,hunger:0},{x:x-1,y:y,tx:x-1,ty:y,hunger:0}];}
else if(tool==='hut'&&camp&&stock.wood>=15&&stock.stone>=5){stock.wood-=15;stock.stone-=5;buildings.push({x,y,type:'hut'});if(people.length<15)people.push({x,y,tx:x,ty:y,hunger:0})}
else if(tool==='store'&&camp&&stock.wood>=12){stock.wood-=12;buildings.push({x,y,type:'store'})}
else if(tool==='move'&&camp){const p=people[selected%people.length];p.tx=x;p.ty=y;selected++}}
function chooseTarget(p){if(!camp)return;if(p.hunger>60){const b=buildings[0];p.tx=b.x;p.ty=b.y;return}const opts=[];for(let y=Math.max(0,Math.floor(p.y)-8);y<Math.min(N,Math.floor(p.y)+9);y++)for(let x=Math.max(0,Math.floor(p.x)-8);x<Math.min(N,Math.floor(p.x)+9);x++){let t=land[y*N+x];if(t==='forest'||t==='stone'||t==='berry')opts.push({x,y,d:dist(p,{x,y}),t})}opts.sort((a,b)=>a.d-b.d);const o=opts[0];if(o){p.tx=o.x;p.ty=o.y}else{p.tx=buildings[0].x;p.ty=buildings[0].y}}
function tick(dt){clock+=dt*.017*speed;if(clock>=24){clock-=24;day++}for(const p of people){p.hunger+=dt*.06*speed;const d=Math.hypot(p.tx-p.x,p.ty-p.y);if(d>.15){p.x+=(p.tx-p.x)/d*Math.min(d,dt*.45*speed);p.y+=(p.ty-p.y)/d*Math.min(d,dt*.45*speed)}else {const x=Math.round(p.x),y=Math.round(p.y),t=inside(x,y)?land[y*N+x]:null;if(p.hunger>60&&stock.food>0){stock.food--;p.hunger=10}else if(t==='forest'){stock.wood++;if(Math.random()<.2)land[y*N+x]='field'}else if(t==='stone'){stock.stone++;if(Math.random()<.15)land[y*N+x]='field'}else if(t==='berry'){stock.food+=2;if(Math.random()<.3)land[y*N+x]='field'}chooseTarget(p)}}}
function draw(){g.clearRect(0,0,innerWidth,innerHeight);const tw=SIZE*scale;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const p=screen(x,y);if(p.x>innerWidth||p.y>innerHeight||p.x+tw<0||p.y+tw<0)continue;const t=land[y*N+x];g.fillStyle=T[t];g.fillRect(p.x,p.y,tw+1,tw+1);g.font=Math.max(9,scale*25)+'px serif';g.textAlign='center';if(t!=='field')g.fillText(({forest:'🌲',stone:'🪨',berry:'🌿',water:''})[t],p.x+tw/2,p.y+tw*.7)}
for(const b of buildings){const p=screen(b.x,b.y);g.font=Math.max(12,scale*34)+'px serif';g.fillText(({camp:'🔥',hut:'🛖',store:'📦'})[b.type],p.x+tw/2,p.y+tw*.8)}
for(const p of people){const s=screen(p.x,p.y);g.font=Math.max(12,scale*25)+'px serif';g.fillText('🧍',s.x+tw/2,s.y+tw*.7)}
if(clock<6||clock>19){g.fillStyle='rgba(8,13,38,.28)';g.fillRect(0,0,innerWidth,innerHeight)}document.querySelector('#info').textContent='День '+day+' · '+Math.floor(clock)+':00 · 👥 '+people.length+' · 🪵 '+stock.wood+' · 🪨 '+stock.stone+' · 🍎 '+stock.food}
let drag=null;c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,moved:false}});c.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(drag.moved){ox+=dx/scale;oy+=dy/scale}drag.x=e.clientX;drag.y=e.clientY});c.addEventListener('pointerup',e=>{if(drag&&!drag.moved&&tool!=='pan'){let q=coord(e.clientX,e.clientY);place(q.x,q.y)}drag=null});c.addEventListener('wheel',e=>{e.preventDefault();scale=Math.max(.45,Math.min(2,scale*(e.deltaY>0?.88:1.12)))},{passive:false});
function save(){localStorage.setItem('epochs-save-v1',JSON.stringify({land,buildings,people,stock,clock,day,camp,ox,oy,scale}));document.querySelector('#hint').textContent='Мир сохранён на этом устройстве'}function reset(){if(confirm('Создать новый мир? Старый прогресс будет удалён.')){localStorage.removeItem('epochs-save-v1');create()}}
function setButtons(){document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')?.includes("'"+tool+"'")))}
try{const data=JSON.parse(localStorage.getItem('epochs-save-v1'));if(data&&data.land?.length===N*N){({land,buildings,people,stock,clock,day,camp,ox,oy,scale}=data)}else create()}catch(e){create()}setButtons();
function frame(now){let dt=Math.min(.08,(now-last)/1000);last=now;stamp+=dt;if(stamp>.7){tick(stamp);stamp=0}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);setInterval(save,30000)
</script></html>
